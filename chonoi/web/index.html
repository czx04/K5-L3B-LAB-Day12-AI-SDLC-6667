<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi — chơi thử</title>
<style>
  html, body { margin: 0; height: 100%; background: #10161c; color: #e8eef2; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; touch-action: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #touch-controls { display: none; position: fixed; inset: auto 12px 14px 12px; z-index: 20; pointer-events: none; justify-content: space-between; }
  #move-pad, #action-pad { display: grid; pointer-events: auto; }
  #move-pad { grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(2, 52px); gap: 6px; }
  #action-pad { grid-template-columns: repeat(2, 58px); gap: 8px; align-items: end; }
  #move-pad button, #action-pad button { border: 1px solid rgba(255,255,255,.24); border-radius: 14px; background: rgba(16,22,28,.78); color: #fff; font-size: 18px; backdrop-filter: blur(8px); user-select: none; }
  #move-pad button:active, #action-pad button:active, #move-pad button.pressed, #action-pad button.pressed { background: rgba(79,195,247,.55); transform: scale(.96); }
  #touch-up { grid-column: 2; grid-row: 1; }
  #touch-left { grid-column: 1; grid-row: 2; }
  #touch-down { grid-column: 2; grid-row: 2; }
  #touch-right { grid-column: 3; grid-row: 2; }
  #touch-interact, #touch-catch { height: 58px; }
  body.mode-quan #touch-catch { display: none; }
  body.mode-quan #action-pad { grid-template-columns: 58px; }
  #connection { position: fixed; top: 12px; right: 12px; z-index: 30; display: none; padding: 7px 10px; border-radius: 999px; background: #b94a45; color: #fff; font-weight: 700; }
  @media (pointer: coarse) { #touch-controls { display: flex; } }
  #toolbar { position:fixed;right:16px;top:12px;display:flex;gap:8px;z-index:45; }
  button { font:inherit;cursor:pointer; }
  #warning-panel { position:fixed;left:50%;top:12px;z-index:46;transform:translateX(-50%);
    display:flex;gap:8px;pointer-events:none;max-width:min(760px,calc(100vw - 24px)); }
  #warning-panel[hidden] { display:none; }
  .warning { border:3px solid #000;border-radius:8px;padding:8px 10px;background:#ffd400;color:#111;font-weight:800;
    box-shadow:0 2px 10px rgba(0,0,0,.45);white-space:nowrap; }
  .warning.danger { background:#ff3b30;color:#fff;border-color:#fff; }
  body.high-contrast { background:#000;color:#fff; }
  body.high-contrast canvas { filter:contrast(1.35) saturate(.85); }
  body.high-contrast #inventory-hud, body.high-contrast #plan,
  body.high-contrast #flow article, body.high-contrast #toolbar button,
  body.high-contrast #flow button { background:#000;color:#fff;border:3px solid #fff; }
  body.high-contrast .inventory-item { background:#111;color:#fff;border:2px solid #fff; }
  body.high-contrast .inventory-item.spoiled { background:#000;color:#fff;border-color:#ffea00; }
  #toolbar button, #flow button { background:#223b46;color:#f4f8fa;border:1px solid #6c8e9b;border-radius:8px;padding:10px 18px;min-height:44px;font-size:18px; }
  button:disabled { opacity:.45;cursor:default; }
  #flow { position:fixed;inset:0;z-index:40;background:rgba(10,20,28,.78);display:flex;align-items:center;justify-content:center;padding:20px;font-size:18px; }
  #flow[hidden], #plan[hidden] { display:none; }
  #flow article { max-width:720px;width:100%;max-height:85vh;overflow:auto;background:#172831;border:1px solid #56717f;padding:28px;border-radius:12px; }
  #flow h1 { margin:0 0 12px;font-size:28px; } #flow p { margin:12px 0; }
  #flow .actions { display:flex;gap:12px;flex-wrap:wrap;margin-top:24px; }
  #flow .offer { display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0;border-bottom:1px solid #38515e; }
  #plan { position:fixed;left:14px;top:86px;max-width:340px;padding:12px;background:rgba(15,33,40,.88);font-size:18px;pointer-events:none; }
  #inventory-hud { position:fixed;left:12px;bottom:12px;z-index:10;max-width:calc(100vw - 24px);box-sizing:border-box;background:rgba(15,33,40,.94);padding:10px;border-radius:8px; }
  #inventory-hud[hidden] { display:none; }
  .inventory-list { display:flex;flex-wrap:wrap;gap:6px;max-height:112px;overflow:auto;margin-top:6px;touch-action:pan-y; }
  .inventory-item { display:grid;gap:3px;padding:5px 8px;background:#263f48;border-radius:5px;font-size:14px; }
  .inventory-item.spoiled { background:#493238;color:#ffb4ab; }
  .inventory-item progress { width:100%;height:8px;accent-color:#6fce98; }
  .inventory-item.stale progress { accent-color:#e8b65b; }
  .inventory-item.spoiled progress { accent-color:#a4a4a4; }
  #key-help { margin-top:8px;color:#cfdee4;font-size:13px; }
  @media (pointer:coarse) { #inventory-hud { bottom:146px; } .inventory-list { max-height:78px; } }
  @media(max-width:700px) { #flow article { padding:18px; } #plan { top:80px;max-width:260px;font-size:16px; } #toolbar { top:auto;bottom:88px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<section id="inventory-hud" aria-label="Nguyên liệu" hidden><strong id="inventory-title"></strong><div id="inventory-list" class="inventory-list"></div><div id="key-help"></div></section>
<aside id="warning-panel" aria-live="assertive" aria-label="Cảnh báo" hidden>
  <div id="warning-monster" class="warning danger" hidden>⚠ THỦY QUÁI GẦN</div>
  <div id="warning-oxygen" class="warning" hidden>🫧 OXY SẮP HẾT</div>
  <div id="warning-customer" class="warning danger" hidden>‼ KHÁCH SẮP GIẬN</div>
</aside>
<div id="toolbar"><button id="pause-button">Tạm dừng (P)</button><button id="contrast-button" aria-pressed="false">Tương phản cao</button><button id="menu-button">Về menu</button></div>
<div id="plan" hidden></div>
<div id="flow" role="dialog" aria-modal="true" aria-label="Chợ nổi" hidden><article id="flow-content"></article></div>
<div id="connection">Mất kết nối</div>
<div id="touch-controls">
  <div id="move-pad">
    <button id="touch-up" data-move="u" aria-label="Đi lên">▲</button>
    <button id="touch-left" data-move="l" aria-label="Đi trái">◀</button>
    <button id="touch-down" data-move="d" aria-label="Đi xuống">▼</button>
    <button id="touch-right" data-move="r" aria-label="Đi phải">▶</button>
  </div>
  <div id="action-pad">
    <button id="touch-interact" data-action="interact">E<br><span>Thao tác</span></button>
    <button id="touch-catch" data-action="catch">Space<br><span>Bắt</span></button>
  </div>
</div>
<script>
"use strict";
/*
 * Client chơi trực tiếp (starter). CHỈ ĐỌC snapshot từ GET /state và gửi phím qua POST /input.
 * Trường nào snapshot chưa có thì bỏ qua (nhóm viết luật tới đâu, hình hiện tới đó). Hình khối tạm, thay bằng đồ họa của nhóm.
 * Phím: WASD / mũi tên = di chuyển · E = interact · Space = catch · R = chơi lại.
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let snap = null, offline = false;
const notifications = [];
let lastEventSignature = "";
let inventorySignature = "";

// ---------- vào: phím ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

function currentInput() {
  const mode = snap ? (snap.phase || snap.mode) : "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);   // gather: xuống = d dương
  if (mode === "quan") dy = -dy;                                // quan: lên (bắc) = z dương
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch") };
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) { /* mất kết nối: poll sẽ báo */ }
  }
  inflight = false;
}
function keyName(e) { return e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase(); }
addEventListener("keydown", (e) => {
  const k = keyName(e);
  if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
  if (k === "escape" || k === "p") { e.preventDefault(); pulse("pause"); return; }
  if (document.getElementById("flow").hidden === false && snap && ["dayintro", "eveningintro"].includes(snap.screen)) { navigate("continue"); return; }
  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "e") down.add("interact");
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  else if (k === "r") { fetch("/restart", { method: "POST" }); lastSent = ""; down.clear(); }
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });

document.querySelectorAll("[data-move]").forEach((button) => {
  const k = button.dataset.move;
  const press = (event) => {
    event.preventDefault();
    down.add(k);
    button.classList.add("pressed");
    pushInput();
  };
  const release = (event) => {
    event.preventDefault();
    down.delete(k);
    button.classList.remove("pressed");
    pushInput();
  };
  button.addEventListener("pointerdown", press);
  button.addEventListener("pointerup", release);
  button.addEventListener("pointercancel", release);
  button.addEventListener("pointerleave", (event) => { if (event.buttons) release(event); });
});
document.querySelectorAll("[data-action]").forEach((button) => {
  const k = button.dataset.action;
  const press = (event) => {
    event.preventDefault();
    down.add(k);
    button.classList.add("pressed");
    pushInput();
  };
  const release = (event) => {
    event.preventDefault();
    down.delete(k);
    button.classList.remove("pressed");
    pushInput();
  };
  button.addEventListener("pointerdown", press);
  button.addEventListener("pointerup", release);
  button.addEventListener("pointercancel", release);
});

async function navigate(action) {
  down.clear();queue=[];lastSent="";
  await flush();
  await fetch("/"+action,{method:"POST"});pushInput();
}
async function pulse(button) {
  down.clear();queue=[];lastSent="";
  queue.push(JSON.stringify({move:[0,0],interact:false,catch:false,[button]:false}));
  queue.push(JSON.stringify({[button]:true}));queue.push(JSON.stringify({[button]:false}));
  await flush();
}
document.getElementById("pause-button").onclick=()=>pulse("pause");
document.getElementById("menu-button").onclick=()=>navigate("menu");
document.getElementById("contrast-button").onclick=()=>{
  const enabled=document.body.classList.toggle("high-contrast");
  const button=document.getElementById("contrast-button");
  button.setAttribute("aria-pressed",enabled ? "true" : "false");
  button.textContent=enabled ? "Tắt tương phản cao" : "Tương phản cao";
};
let flowSignature="";
function updateFlow() {
  const phase=snap.phase || snap.mode, paused=snap.state==="paused";
  const screen=paused ? "paused" : (snap.screen || "playing");
  const flow=document.getElementById("flow"), plan=document.getElementById("plan");
  document.getElementById("pause-button").textContent=paused ? "Tiếp tục (P)" : "Tạm dừng (P)";
  document.getElementById("toolbar").style.display=["menu","summary"].includes(screen) ? "none" : "flex";
  plan.hidden=!(snap.day_plan && phase==="gather" && screen==="playing");
  if(!plan.hidden){
    const counts=inventoryCounts(snap.hold);
    plan.replaceChildren();
    const title=document.createElement("strong");title.textContent=`Ngày ${snap.day} · Má Tư cần`;plan.append(title);
    Object.entries(snap.day_plan.ingredients || {}).forEach(([k,n])=>{const row=document.createElement("div");row.textContent=`${KIND_NAME[k]||k}: ${counts[k]||0}/${n}`;plan.append(row);});
  }
  const shop=phase==="shop" && screen==="playing";
  const signature=JSON.stringify([screen,shop,snap.day,snap.money,snap.upgrades,snap.day_result,snap.sales,shop ? snap.stock : null]);
  if(signature===flowSignature){const timer=document.getElementById("shop-timer");if(timer)timer.textContent=`Tự đóng sau ${fmtTime(snap.time_left_ticks)}`;return;}
  flowSignature=signature;
  flow.hidden=screen==="playing" && !shop;
  if(flow.hidden)return;
  const article=document.getElementById("flow-content");article.replaceChildren();
  const add=(tag,value)=>{const el=document.createElement(tag);el.textContent=value;article.append(el);return el;};
  const actions=()=>{const el=document.createElement("div");el.className="actions";article.append(el);return el;};
  const button=(parent,label,fn)=>{const b=document.createElement("button");b.textContent=label;b.onclick=fn;parent.append(b);return b;};
  const ingredients=(items)=>Object.entries(inventoryCounts(items)).map(([k,n])=>`${KIND_NAME[k]||k} ×${n}`).join(" · ") || "Trống";
  if(screen==="menu"){
    add("h1","Quán Ăn Chợ Nổi");add("p","Cùng Út Sen đi chợ, mở quán và nâng cấp cho ngày tiếp theo.");
    const a=actions();button(a,"Chơi",()=>navigate("play"));button(a,"Thoát",()=>{article.replaceChildren();add("h1","Hẹn gặp lại!");add("p","Bạn có thể đóng thẻ trình duyệt này.");button(actions(),"Về menu",()=>{flowSignature="";updateFlow();});});
  } else if(paused){add("h1","Tạm dừng");add("p","Đồng hồ, oxy, cá, quái và Shop đang dừng.");const a=actions();button(a,"Tiếp tục",()=>navigate("continue"));button(a,"Về menu",()=>navigate("menu"));
  } else if(screen==="dayintro"){
    add("h1",`Ngày ${snap.day} · Lời dặn của Má Tư`);
    Object.entries(snap.day_plan.dishes).forEach(([k,n])=>add("p",`${dishName(k)} ×${n}`));
    add("p","Cần lấy: "+ingredients(snap.day_plan.ingredients));add("p","WASD để bơi · E hái/cập bến · Space bắt cá · Esc/P tạm dừng");button(actions(),"Bắt đầu buổi sáng",()=>navigate("continue"));
  } else if(screen==="eveningintro"){
    add("h1",`Ngày ${snap.day} · Mở quán`);add("p","Đã nhập kho: "+ingredients(snap.stock));
    const counts=inventoryCounts(availableStock(snap));
    const possible=Object.keys(snap.day_plan?.dishes||{}).filter(k=>Object.entries(snap.menu?.[k]?.recipe||{}).every(([i,n])=>(counts[i]||0)>=n));
    renderInventory(add("div",""),snap.stock,snap.customers);
    add("p","Có thể nấu: "+(possible.map(dishName).join(" · ")||"Chưa đủ nguyên liệu"));button(actions(),"Mở cửa",()=>navigate("continue"));
  } else if(screen==="dayresult"){
    const r=snap.day_result;add("h1",`Kết quả Ngày ${snap.day}`);add("p",`Đã phục vụ ${r.served} · Rời quán ${r.left}`);add("p",`Thu ${r.money}k · Boa ${r.tips}k · Uy tín ${r.reputation_delta>=0?"+":""}${r.reputation_delta.toFixed(1)}`);button(actions(),"Đến Shop",()=>navigate("continue"));
  } else if(screen==="summary"){
    add("h1","Tổng kết chợ nổi");add("p",`Hoàn thành ${snap.days_completed} ngày · Tiền còn ${snap.money}k · Tổng thu ${snap.earned}k`);add("p",`Điểm ${snap.score} · Uy tín ${snap.reputation.toFixed(1)}`);
    const best=Object.entries(snap.sales||{}).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]))[0];add("p",best?`Bán chạy: ${dishName(best[0])} ×${best[1]}`:"Chưa bán được món nào");button(actions(),"Về menu",()=>navigate("menu"));
  } else if(shop){
    add("h1",`Shop · Cuối Ngày ${snap.day}`);add("p",`Ví ${snap.money}k · Tổng thu ${snap.earned}k · Điểm ${snap.score}`);add("p","Nâng cấp có hiệu lực từ Ngày kế tiếp.");add("p",`Tự đóng sau ${fmtTime(snap.time_left_ticks)}`).id="shop-timer";
    add("h2","Kho còn lại");renderInventory(add("div",""),snap.stock,snap.customers);
    Object.entries(snap.shop?.upgrades || {}).forEach(([kind,rows])=>{
      const level=snap.upgrades[kind]||0,next=rows[level],row=add("div","");row.className="offer";
      const label=document.createElement("span");label.textContent=`${kind==="oxygen"?"Bình oxy":"Áo phao"} · Cấp ${level} · Đang áp dụng ${snap.active_upgrades[kind]||0}`;row.append(label);
      const buy=button(row,next?`Mua ${next.price}k · ${next.oxygen_max_s ? next.oxygen_max_s+"s oxy" : next.hp_max+" Máu"}`:"Đã tối đa",()=>{queue.push(JSON.stringify({buy:kind}));flush();});buy.disabled=!next;
    });
    button(actions(),snap.day===5?"Đóng Shop và tổng kết":"Đóng Shop / Ngày tiếp",()=>pulse("shop_done"));
  }
}

// ---------- ra: poll snapshot ----------
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const nextSnap = await r.json();
    const previousMode = snap && `${snap.day}:${snap.phase || snap.mode}`;
    const modeChanged = previousMode && previousMode !== `${nextSnap.day}:${nextSnap.phase || nextSnap.mode}`;
    if (modeChanged) {
      down.clear();
      queue = [];
      lastSent = "";
      lastEventSignature = "";
    }
    snap = nextSnap;
    document.body.classList.toggle("mode-quan", (snap.phase || snap.mode) === "quan");
    if (modeChanged) {
      pushInput();
      pushNotification((snap.phase || snap.mode) === "quan" ? "Buổi sáng kết thúc · bắt đầu mở quán" : "Bắt đầu lại buổi sáng");
    }
    updateFlow();
    updateInventoryHud();
    updateWarnings();
    updateNotifications();
    offline = false;
  } catch (e) { offline = true; }
  document.getElementById("connection").style.display = offline ? "block" : "none";
  setTimeout(poll, 16);
}
poll();

// ---------- vẽ ----------
const KIND_COLOR = { ca_loc: "#7c9a52", ca_linh: "#d6e6f2", ca_keo: "#d9a066", bong_dien_dien: "#f2c230", bong_sung: "#e8799c", keo_neo: "#8fcf6b" };
const KIND_NAME = { ca_loc: "cá lóc", ca_linh: "cá linh", ca_keo: "cá kèo", bong_dien_dien: "điên điển", bong_sung: "bông súng", keo_neo: "kèo nèo" };
const MENU_NAME = { ca_loc_nuong_trui: "Cá lóc nướng trui", goi_bong_sung: "Gỏi bông súng", lau_ca_linh_dien_dien: "Lẩu cá linh điên điển", canh_chua_ca_loc: "Canh chua cá lóc", ca_keo_nuong: "Cá kèo nướng muối ớt", lau_mam: "Lẩu mắm miền Tây" };
const kc = (k) => KIND_COLOR[k] || "#bbbbbb";
const dishName = (dish) => { const id = typeof dish === "object" && dish ? dish.dish_id : dish; return MENU_NAME[id] || id || "?"; };

function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
function text(s, x, y, o = {}) {
  ctx.font = Math.max(18, o.size || 18) + "px system-ui, sans-serif";
  ctx.fillStyle = o.color || "#e8eef2";
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  ctx.fillText(s, x, y);
}
function bar(x, y, w, h, frac, color, label) {
  ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color; ctx.fillRect(x, y, w * Math.max(0, Math.min(1, frac)), h);
  ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
  if (label) text(label, x + w / 2, y + h - 3, { size: 11, align: "center" });
}
function fmtTime(ticks) {
  const s = Math.ceil(ticks / 60);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function brief(d) {
  try { const s = JSON.stringify(d); return s.length > 60 ? s.slice(0, 57) + "…" : s; } catch (e) { return ""; }
}

// Snapshot v1.2 uses individuals; older snapshots omit freshness.
function itemKind(item) { return typeof item === "string" ? item : item?.kind; }
function inventoryCounts(items) {
  if(!Array.isArray(items))return {...(items || {})};
  const counts={};items.forEach(it=>{const k=itemKind(it);if(k)counts[k]=(counts[k]||0)+1;});return counts;
}
function reservedIds(customers) {
  return new Set((customers || []).flatMap(c=>Array.isArray(c.reserved) ? c.reserved : []));
}
function availableStock(state) {
  if(Array.isArray(state.stock)) {
    const held=reservedIds(state.customers);
    return state.stock.filter(it=>!held.has(it.id) && !(typeof it.fresh === "number" && it.fresh < 30));
  }
  const counts=inventoryCounts(state.stock);
  (state.customers || []).forEach(c=>{if(!Array.isArray(c.reserved))Object.entries(c.reserved || {}).forEach(([k,n])=>counts[k]=(counts[k]||0)-n);});
  return counts;
}
function renderInventory(parent,items,customers) {
  parent.replaceChildren();parent.className="inventory-list";
  const held=reservedIds(customers);
  const rows=Array.isArray(items) ? items : Object.entries(items || {}).filter(([,n])=>n>0).map(([kind,count])=>({kind,count}));
  if(!rows.length){parent.textContent="(trống)";return;}
  rows.forEach(it=>{
    const fresh=typeof it?.fresh === "number" && Number.isFinite(it.fresh) ? it.fresh : null;
    const spoiled=fresh !== null && fresh < 30;
    const row=document.createElement("div");row.className="inventory-item"+(spoiled ? " spoiled" : fresh !== null && fresh < 60 ? " stale" : "");
    const label=document.createElement("span");
    // Show two decimals near the threshold so 29.996 never appears as an unlabelled 30%.
    label.textContent=`${KIND_NAME[itemKind(it)] || itemKind(it)}${it.id ? " · "+it.id : ""}${it.count ? " ×"+it.count : ""}${fresh === null ? "" : " · "+fresh.toFixed(2)+"%"}${spoiled ? " · ươn" : ""}${held.has(it.id) ? " · giữ chỗ" : ""}`;
    row.append(label);
    if(fresh !== null){const meter=document.createElement("progress");meter.max=100;meter.value=fresh;meter.setAttribute("aria-label",label.textContent);row.append(meter);}
    parent.append(row);
  });
}
function updateWarnings() {
  const panel=document.getElementById("warning-panel");
  if(!snap || snap.state==="paused" || (snap.screen && snap.screen !== "playing")){
    panel.hidden=true;
    ["monster","oxygen","customer"].forEach(k=>document.getElementById("warning-"+k).hidden=true);
    return;
  }
  const phase=snap.phase || snap.mode;
  let monster=false, oxygen=false, customer=false;
  if(phase==="gather"){
    const p=snap.player?.pos;
    if(p){
      const threshold=(snap.meta?.monsters?.detect_radius || 12);
      monster=(snap.monsters || []).some(m=>{
        if(!m.pos)return false;
        const dx=m.pos[0]-p[0], dd=(m.pos[1]||0)-(p[1]||0);
        return Math.hypot(dx,dd)<=threshold;
      });
    }
    if(typeof snap.player?.oxygen_ticks==="number" && typeof snap.player?.oxygen_max_ticks==="number"){
      oxygen=snap.player.oxygen_ticks/snap.player.oxygen_max_ticks<=0.25;
    }
  }
  if(phase==="quan"){
    const patienceMax=(snap.meta?.patience_s||0)*60;
    customer=(snap.customers || []).some(c=>{
      const left=c.patience_ticks_left;
      return typeof left==="number" && patienceMax>0 && left/patienceMax<=0.25;
    });
  }
  document.getElementById("warning-monster").hidden=!monster;
  document.getElementById("warning-oxygen").hidden=!oxygen;
  document.getElementById("warning-customer").hidden=!customer;
  panel.hidden=!(monster||oxygen||customer);
}
function updateInventoryHud() {
  const phase=snap.phase || snap.mode, panel=document.getElementById("inventory-hud");
  panel.hidden=!["gather","quan"].includes(phase) || (snap.screen && snap.screen !== "playing") || snap.state === "paused";
  if(panel.hidden)return;
  const items=phase === "gather" ? snap.hold : snap.stock;
  const signature=JSON.stringify([phase,items,snap.hold_count,snap.hold_capacity,snap.customers]);
  if(signature===inventorySignature)return;inventorySignature=signature;

function pushNotification(text, tone = "normal") {
  notifications.push({ text, tone, until: performance.now() + 2600 });
  if (notifications.length > 4) notifications.shift();
}

function updateNotifications() {
  const ev = snap.events || [];
  const signature = e => JSON.stringify([e.tick,e.phase,e.day,e.name,e.data || {}]);
  const previous = ev.findIndex(e => signature(e) === lastEventSignature);
  const unseen = previous < 0 ? ev : ev.slice(previous + 1);
  unseen.forEach(e => {
    const tone = ["spoiled","hold_full","oxygen_empty","choke","faint","no_dish","customer_left"].includes(e.name) ? "danger" : "normal";
    const d=e.data || {};
    const message=e.name === "spoiled" ? `${KIND_NAME[d.kind] || d.kind || "Nguyên liệu"} ${d.item_id || ""} đã ươn · ${d.location === "hold" ? "giỏ" : "kho"}` : EVENT_TEXT[e.name] || e.name;
    pushNotification(message,tone);
  });
  if(ev.length)lastEventSignature=signature(ev[ev.length-1]);
}

function drawGather(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds;
  if (!b || !b.x || !b.d || !snap.player || !snap.player.pos) return;
  const [xMin, xMax] = b.x, [dMin, dMax] = b.d;
  const tick = snap.sim_tick ?? snap.tick ?? 0;
  const surfaceY = h * 0.145, hudBottom = 72;
  const worldWidth = xMax - xMin;
  const depth = dMax - Math.max(0, dMin);
  const scale = Math.max(1, Math.min((w - 24) / worldWidth, (h - surfaceY - hudBottom) / depth));
  const sx = (x) => 12 + (x - xMin) * scale;
  const sy = (d) => surfaceY + Math.max(0, d) * scale;
  const bedY = Math.min(h - hudBottom, sy(dMax * 0.86));

  // sunset sky and distant shoreline
  const sky = ctx.createLinearGradient(0, 0, 0, surfaceY + 8);
  sky.addColorStop(0, "#f5a96f");
  sky.addColorStop(0.72, "#ffd89a");
  sky.addColorStop(1, "#f2dcaa");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, w, surfaceY + 4);
  ctx.fillStyle = "#fff7da";
  ctx.beginPath();
  ctx.arc(w * 0.81, surfaceY * 0.39, Math.min(27, h * 0.04), 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#547a3d";
  ctx.beginPath();
  ctx.moveTo(0, surfaceY);
  for (let i = 0; i <= 12; i++) {
    const x = (w / 12) * i;
    const y = surfaceY - 5 - (Math.sin(i * 5.7) * 0.5 + 0.5) * 13;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(w, surfaceY + 5); ctx.lineTo(0, surfaceY + 5); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#78924d";
  ctx.beginPath();
  ctx.moveTo(0, surfaceY + 1);
  for (let i = 0; i <= 14; i++) {
    const x = (w / 14) * i;
    ctx.lineTo(x, surfaceY - 2 - (Math.sin(i * 4.1 + 1) * 0.5 + 0.5) * 8);
  }
  ctx.lineTo(w, surfaceY + 7); ctx.lineTo(0, surfaceY + 7); ctx.closePath(); ctx.fill();

  // warm, shadowed water
  const water = ctx.createLinearGradient(0, surfaceY, 0, h);
  water.addColorStop(0, "#b8894e");
  water.addColorStop(0.48, "#8e6638");
  water.addColorStop(1, "#49331f");
  ctx.fillStyle = water;
  ctx.fillRect(0, surfaceY, w, h - surfaceY);
  ctx.strokeStyle = "rgba(255,244,208,.72)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let x = 0; x <= w; x += 16) {
    const y = surfaceY + Math.sin(x / 34 + tick / 18) * 1.8;
    if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();

  // broad sunbeams, clipped below the surface
  ctx.save();
  ctx.beginPath(); ctx.rect(0, surfaceY, w, h - surfaceY); ctx.clip();
  for (let i = 0; i < 7; i++) {
    const startX = ((i + 0.25) / 7) * w;
    const drift = Math.sin(tick / 170 + i * 1.7) * 20;
    const spread = w * (0.035 + (i % 3) * 0.009);
    ctx.fillStyle = "rgba(255,222,159,.075)";
    ctx.beginPath();
    ctx.moveTo(startX - spread * 0.18, surfaceY);
    ctx.lineTo(startX + spread * 0.18, surfaceY);
    ctx.lineTo(startX + spread + drift, bedY);
    ctx.lineTo(startX - spread + drift, bedY);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  // soft underwater ridges
  ctx.fillStyle = "rgba(68,48,29,.28)";
  ctx.beginPath();
  ctx.moveTo(0, bedY - 38);
  for (let i = 0; i <= 10; i++) {
    const x = (w / 10) * i;
    ctx.quadraticCurveTo(x + w / 20, bedY - 86 + Math.sin(i * 2.2) * 16, x + w / 10, bedY - 36);
  }
  ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "rgba(43,32,23,.68)";
  ctx.beginPath();
  ctx.moveTo(0, bedY + 2);
  for (let i = 0; i <= 12; i++) {
    const x = (w / 12) * i;
    ctx.quadraticCurveTo(x + w / 24, bedY - 36 + Math.sin(i * 1.6) * 13, x + w / 12, bedY + 4);
  }
  ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath(); ctx.fill();

  // anchored plants with a gentle current-driven sway
  const grassCount = Math.max(18, Math.ceil(w / 48));
  const grassBase = h - hudBottom - 10;
  for (let i = 0; i < grassCount; i++) {
    const x = (i / (grassCount - 1)) * w;
    const height = 55 + ((i * 37) % 120);
    const sway = Math.sin(tick / 22 + i * 1.9) * 11;
    ctx.strokeStyle = i % 4 === 0 ? "#327347" : "#3e8549";
    ctx.lineWidth = 2 + (i % 3);
    ctx.beginPath();
    ctx.moveTo(x, grassBase);
    ctx.quadraticCurveTo(x - sway, grassBase - height * 0.45, x + sway * 0.45, grassBase - height);
    ctx.stroke();
  }

  // bubbles loop deterministically from the game tick (no random state)
  for (let i = 0; i < 34; i++) {
    const cycle = (tick * 0.003 + i * 0.173) % 1;
    const x = ((i * 97.31 + Math.sin(tick / 90 + i) * 18) % w + w) % w;
    const y = bedY - cycle * (bedY - surfaceY - 12);
    const r = 1.5 + (i % 4) * 0.75;
    ctx.strokeStyle = `rgba(211,224,202,${0.28 + (i % 3) * 0.08})`;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
  }

  // lily pads/nodes from the authoritative snapshot
  ([...(snap.nodes || [])]).sort((a, b) => String(a.id).localeCompare(String(b.id), "en", { numeric: true })).forEach((n) => {
    if (!n.pos) return;
    const x = sx(n.pos[0]), y = sy(n.pos[1]);
    const ready = n.ready !== false;
    ctx.save();
    ctx.globalAlpha = ready ? 1 : 0.38;
    ctx.fillStyle = "#315d35";
    ctx.beginPath(); ctx.ellipse(x, y + 2, scale * 0.82, scale * 0.2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = kc(n.kind);
    for (let petal = 0; petal < 5; petal++) {
      ctx.beginPath();
      ctx.ellipse(x + Math.cos(petal * 1.25) * scale * 0.22, y - 2 + Math.sin(petal * 1.25) * scale * 0.13,
        scale * 0.22, scale * 0.11, petal * 1.25, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
    text(n.id, x, y - scale * 0.45, { size: 10, align: "center", color: "#fff2cf" });
    if (!ready && n.regrow_ticks) text(Math.ceil(n.regrow_ticks / 60) + "s", x, y + scale * 0.55, { size: 10, align: "center", color: "#fff" });
  });

  // fish shoals: each marker remains the fish entity used by the catch contract
  ([...(snap.fish || [])]).sort((a, b) => String(a.id).localeCompare(String(b.id), "en", { numeric: true })).forEach((f, index) => {
    if (!f.pos) return;
    const x = sx(f.pos[0]), y = sy(f.pos[1]);
    const angle = (f.heading_deg || 0) * Math.PI / 180;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    if (f.kind === "ca_loc") {
      drawLargeFish(0, 0, scale * 8.5, tick + index * 11);
    } else {
      for (let j = 0; j < 5; j++) {
        drawSmallFish((j - 2) * scale * 0.82, Math.sin(j * 2.3 + tick / 18) * scale * 0.22,
          scale * 0.55, "#e5d7a3", index * 2 + j, tick);
      }
    }
    ctx.restore();
    text(f.id, x, y - scale * 0.75, { size: 10, align: "center", color: "#fff3d4" });
  });

  // Authoritative monsters, including chase/recoil state. No client simulation.
  (snap.monsters || []).forEach((m) => {
    const x = sx(m.pos[0]), y = sy(m.pos[1]);
    ctx.save();ctx.translate(x,y);
    ctx.fillStyle = m.state === "chase" ? "#b975d4" : m.state === "recoil" ? "#b5abbc" : "#586b3d";
    ctx.strokeStyle = "#e9d9b8";ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(0,0,scale*1.8,scale*.55,0,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.moveTo(scale*1.3,-scale*.45);ctx.lineTo(scale*2.5,0);ctx.lineTo(scale*1.3,scale*.45);ctx.closePath();ctx.fill();ctx.stroke();
    for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(i*scale,-scale*.3);ctx.lineTo((i-.3)*scale,-scale*.85);ctx.lineTo((i+.3)*scale,-scale*.3);ctx.fill();}
    ctx.restore();text(`${m.id} · ${m.state}`, x, y-scale, {align:"center",color:"#fff0ff"});
  });

  // dock and interaction radius
  const dp = meta.dock_pos, dr = meta.dock_radius;
  if (dp && dr !== undefined) {
    const dx = sx(dp[0]), dy = sy(dp[1]);
    ctx.strokeStyle = "rgba(255,235,174,.65)";
    ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.arc(dx, dy, dr * scale, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = "#795333";
    ctx.fillRect(dx - scale * 1.7, dy - scale * 0.16, scale * 3.4, scale * 0.3);
    ctx.fillStyle = "#c95c43";
    ctx.beginPath();
    ctx.moveTo(dx - scale * 0.55, dy - scale * 0.18);
    ctx.lineTo(dx + scale * 0.55, dy - scale * 0.18);
    ctx.lineTo(dx + scale * 0.82, dy - scale * 0.7);
    ctx.lineTo(dx - scale * 0.82, dy - scale * 0.7);
    ctx.closePath(); ctx.fill();
    text("Bến · E", dx, dy - scale * 0.82, { size: 11, align: "center", color: "#442f20" });
  }

  // swimmer and gameplay interaction radius
  const p = snap.player;
  const px = sx(p.pos[0]), py = sy(p.pos[1]);
  const underwater = p.at_surface === undefined ? p.pos[1] > 0.5 : !p.at_surface;
  if (underwater && meta.catch_radius) {
    ctx.strokeStyle = "rgba(245,232,193,.24)";
    ctx.beginPath(); ctx.arc(px, py, meta.catch_radius * scale, 0, Math.PI * 2); ctx.stroke();
  } else if (!underwater && meta.interact_radius) {
    ctx.strokeStyle = "rgba(245,232,193,.3)";
    ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * scale, 0, Math.PI * 2); ctx.stroke();
  }
  drawDiver(px, py, Math.max(28, Math.min(88, scale * 4.4)), p.heading_deg || 0, tick, p.invuln_ticks > 0);

  const nearby = (snap.monsters || []).some(m => Math.hypot(m.pos[0]-p.pos[0],m.pos[1]-p.pos[1]) <= (meta.monsters?.species?.[m.kind]?.detect_radius || 0));
  if (nearby) { ctx.strokeStyle="#bd7be2";ctx.lineWidth=10;ctx.strokeRect(5,5,w-10,h-10);text("Thủy quái!",w/2,70,{align:"center",color:"#e4b7ff",size:24}); }
  if (p.oxygen_ticks === 0 && underwater) text("Hết hơi!",w/2,100,{align:"center",color:"#ff8a80",size:24});
  const nearDock = dp && Math.hypot(p.pos[0]-dp[0],p.pos[1]-dp[1]) <= dr;
  const nearNode = !underwater && (snap.nodes || []).some(n=>n.ready && Math.hypot(n.pos[0]-p.pos[0],n.pos[1]-p.pos[1]) <= meta.interact_radius);
  if (nearDock || nearNode) text(nearDock ? "E · Cập bến mở quán" : "E · Hái nguyên liệu",w/2,h-80,{align:"center",color:"#fff3cf"});
  // HUD
  ctx.fillStyle = "rgba(53,38,25,.34)";
  ctx.fillRect(0, 0, 390, 64);
  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 28, { size: 20, color: snap.time_left_ticks <= 1800 ? "#ff8078" : "#fff" });
  if (p.oxygen_ticks !== undefined && p.oxygen_max_ticks) {
    const low = p.oxygen_ticks < p.oxygen_max_ticks * 0.25;
    bar(110, 12, 220, 18, p.oxygen_ticks / p.oxygen_max_ticks, low ? ((snap.sim_tick % 30 < 15) ? "#ef5350" : "#ffb4ab") : "#4fc3f7", "Oxy " + Math.ceil(p.oxygen_ticks / 60) + "s");
  }
  if (p.hp !== undefined && p.hp_max) {
    let hearts = "";
    for (let i = 0; i < p.hp_max; i++) hearts += i < p.hp ? "♥" : "♡";
    text(hearts, 345, 29, { size: 22, color: "#ff6b81" });
  }
  text(`x ${p.pos[0].toFixed(1)}  d ${p.pos[1].toFixed(1)}`, 14, 52, { size: 12, color: "#fff0d2" });
  if (p.catch_cd_ticks > 0) text("Hồi chiêu " + (p.catch_cd_ticks / 60).toFixed(1) + "s", 150, 52, { size: 12, color: "#fff0d2" });


}

// ----- cảnh QUÁN: nhìn từ trên xuống, x sang phải, z lên (bắc) -----
function drawQuan(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds;
  if (!b || !b.x || !b.z) return;
  const X = b.x[1], Z = b.z[1], top = 64, bottom = 40;
  const s = Math.max(1, Math.min((w - 40) / X, (h - top - bottom) / Z));
  const ox = (w - s * X) / 2, oy = top;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;
  ctx.fillStyle = "#c9a36b"; ctx.fillRect(sx(0), sy(Z), X * s, Z * s);
  ctx.strokeStyle = "#6b4a2b"; ctx.lineWidth = 4; ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);
  // bếp
  ([...(snap.stoves || [])]).sort((a, b) => String(a.id).localeCompare(String(b.id), "en", { numeric: true })).forEach((st) => {
    const col = st.state === "cooking" ? "#e8892b" : st.state === "ready" ? "#6fbf5a" : "#6d6d72";
    ctx.fillStyle = col; ctx.fillRect(sx(st.pos[0]) - 0.8 * s, sy(st.pos[1]) - 0.8 * s, 1.6 * s, 1.6 * s);
    text(st.id, sx(st.pos[0]), sy(st.pos[1]) + 4, { size: 12, align: "center", color: "#111" });
    if (st.dish) text(dishName(st.dish), sx(st.pos[0]), sy(st.pos[1]) - 0.95 * s, { size: 10, align: "center", color: "#2a1a0a" });
    if (st.state === "cooking" && st.cook_ticks_left !== undefined) {
      const total = (snap.menu?.[st.dish?.dish_id]?.cook_s || 1)*60;
      bar(sx(st.pos[0])-.8*s, sy(st.pos[1])+.9*s,1.6*s,18,1-st.cook_ticks_left/total,"#e8892b",Math.ceil(st.cook_ticks_left/60)+"s");
    } else if (st.state === "ready") text("Chín · E để bưng",sx(st.pos[0]),sy(st.pos[1])+1.2*s,{align:"center",color:"#21451c"});
  });
  // bàn + khách
  const patMax = meta.patience_s === undefined ? undefined : meta.patience_s * 60;
  const byTable = {};
  ([...(snap.customers || [])]).sort((a, b) => String(a.id).localeCompare(String(b.id), "en", { numeric: true })).forEach((c) => (byTable[c.table_id] = c));
  ([...(snap.tables || [])]).sort((a, b) => String(a.id).localeCompare(String(b.id), "en", { numeric: true })).forEach((tb) => {
    ctx.fillStyle = "#8a5a2e"; ctx.beginPath(); ctx.arc(sx(tb.pos[0]), sy(tb.pos[1]), 0.9 * s, 0, Math.PI * 2); ctx.fill();
    text(tb.id, sx(tb.pos[0]), sy(tb.pos[1]) + 4, { size: 12, align: "center", color: "#fff" });
    const c = byTable[tb.id];
    if (c) {
      const cx = sx(tb.pos[0]), cy = sy(tb.pos[1]) - 1.5 * s;
      const state = c.state || "waiting";
      ctx.fillStyle = state === "eating" ? "#7bc67b" : state === "assigned" ? "#f4b6c2" : "#d8a86a"; ctx.beginPath(); ctx.arc(cx, cy, 0.55 * s, 0, Math.PI * 2); ctx.fill();
      const dish = c.dish || c.dish_id;
      text(dishName(dish), cx, cy - 0.75 * s, { size: 10, align: "center", color: "#2a1a0a" });
      const patience = c.patience_ticks ?? c.patience_ticks_left;
      if (patience !== undefined && patMax) bar(cx - 0.8 * s, cy + 0.65 * s, 1.6 * s, 10, patience / patMax, patience < patMax*.25 ? "#ef5350" : "#89ba8e");
      text(state, cx, cy + 0.95 * s, { size: 9, align: "center", color: "#4a331d" });
    }
  });
  // người chơi
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    if (meta.interact_radius) { ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
    ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.5 * s, 0, Math.PI * 2); ctx.fill();
    if (snap.hand) {
      const hand = typeof snap.hand === "string" ? snap.hand : (snap.hand.dish_id || snap.hand.dish || "món");
      text("🍲 " + dishName(hand), px, py - 0.8 * s, { size: 11, align: "center", color: "#2a1a0a" });
    }
  }
  // HUD
  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 28, { size: 20, color: snap.time_left_ticks <= 1800 ? "#ff8078" : "#fff" });
  text(`Tiền ca ${snap.shift_earned ?? snap.day_result?.money ?? snap.earned ?? 0}k · Ví ${snap.money ?? 0}k · uy tín ${(snap.reputation ?? 0).toFixed(1)} · điểm ${snap.score ?? 0}`, 110, 28, { size: 16 });

}

function frame() {
  requestAnimationFrame(frame);  // đặt trước để lỗi vẽ không làm dừng vòng lặp
  const [w, h] = fit();
  ctx.fillStyle = "#10161c"; ctx.fillRect(0, 0, w, h);
  if (snap) {
    if ((snap.phase || snap.mode) === "quan") drawQuan(w, h); else if ((snap.phase || snap.mode) === "gather") drawGather(w, h);
    eventLog(w, h);
    drawNotifications(w);
    overlay(w, h);
  } else {
    text(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2, { align: "center", size: 18 });
  }
}
requestAnimationFrame(frame);
</script>
